<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 880" style="background-color: white; font-family: sans-serif;">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000" />
        </marker>
    </defs>

    <style>
        /* 定义黑白极简CSS样式 */
        .box { fill: #fff; stroke: #000; stroke-width: 2px; }
        .box-bg { fill: none; stroke: #000; stroke-width: 1.5px; stroke-dasharray: 8,8; rx: 10px; }
        .box-highlight { fill: #fff; stroke: #000; stroke-width: 3px; rx: 25px; }
        .text-title { font-size: 18px; font-weight: bold; fill: #000; }
        .text-main { font-size: 16px; font-weight: bold; fill: #000; }
        .text-sub { font-size: 14px; fill: #000; }
        .line { fill: none; stroke: #000; stroke-width: 2px; }
        .line-dash { fill: none; stroke: #000; stroke-width: 2px; stroke-dasharray: 5,5; }
    </style>

    <rect class="box-bg" x="30" y="30" width="740" height="150" />
    <text class="text-title" x="50" y="65">视觉感知</text>
    
    <rect class="box" x="60" y="90" width="180" height="60" rx="8" />
    <text class="text-main" x="150" y="125" text-anchor="middle">摄像头获取画面</text>

    <rect class="box" x="310" y="90" width="180" height="60" rx="8" />
    <text class="text-main" x="400" y="125" text-anchor="middle">AI模型识别目标</text>

    <rect class="box" x="560" y="90" width="180" height="60" rx="8" />
    <text class="text-main" x="650" y="117" text-anchor="middle">算法过滤闪烁</text>
    <text class="text-sub" x="650" y="137" text-anchor="middle">与误检噪点</text>

    <path class="line" d="M 240 120 L 300 120" marker-end="url(#arrow)" />
    <path class="line" d="M 490 120 L 550 120" marker-end="url(#arrow)" />

    <path class="line" d="M 650 150 L 650 230 L 400 230 L 400 270" marker-end="url(#arrow)" />
    <rect x="230" y="215" width="340" height="30" fill="#fff" />
    <text class="text-sub" x="400" y="235" text-anchor="middle" font-weight="bold">串口传输数据帧：目标类别、坐标、置信度</text>

    <rect class="box-bg" x="30" y="260" width="740" height="240" />
    <text class="text-title" x="50" y="295">逻辑决策</text>

    <rect class="box" x="310" y="310" width="180" height="50" rx="8" />
    <text class="text-main" x="400" y="340" text-anchor="middle">STM32 接收与解析</text>

    <path class="line" d="M 400 360 L 400 390" marker-end="url(#arrow)" />

    <rect class="box" x="310" y="400" width="180" height="40" rx="20" />
    <text class="text-main" x="400" y="425" text-anchor="middle">判断当前系统状态</text>

    <path class="line-dash" d="M 310 420 L 155 420 L 155 450" marker-end="url(#arrow)" />
    <rect x="180" y="405" width="110" height="30" fill="#fff" />
    <text class="text-sub" x="235" y="425" text-anchor="middle" font-weight="bold">没看到目标</text>

    <rect class="box" x="75" y="460" width="160" height="50" rx="8" />
    <text class="text-main" x="155" y="490" text-anchor="middle">启动全景/局部搜索</text>

    <path class="line" d="M 490 420 L 620 420 L 620 450" marker-end="url(#arrow)" />
    <rect x="510" y="405" width="100" height="30" fill="#fff" />
    <text class="text-sub" x="555" y="425" text-anchor="middle" font-weight="bold">已锁定目标</text>

    <rect class="box" x="520" y="460" width="200" height="50" rx="8" />
    <text class="text-main" x="620" y="490" text-anchor="middle">计算偏差与提示参数</text>

    <path class="line" d="M 620 510 L 620 570" />
    <path class="line" d="M 155 570 L 640 570" />
    
    <path class="line" d="M 155 570 L 155 610" marker-end="url(#arrow)" />
    <path class="line" d="M 320 570 L 320 610" marker-end="url(#arrow)" />
    <path class="line" d="M 480 570 L 480 610" marker-end="url(#arrow)" />
    <path class="line" d="M 640 570 L 640 610" marker-end="url(#arrow)" /> <path class="line-dash" d="M 155 510 L 155 570" />

    <rect class="box-bg" x="30" y="530" width="740" height="320" />
    <text class="text-title" x="50" y="560"> 动作与交互</text>

    <rect class="box" x="80" y="620" width="150" height="60" rx="8" />
    <text class="text-main" x="155" y="645" text-anchor="middle">双轴舵机云台</text>
    <text class="text-sub" x="155" y="665" text-anchor="middle">转动追踪或搜索</text>

    <rect class="box" x="250" y="620" width="140" height="60" rx="8" />
    <text class="text-main" x="320" y="645" text-anchor="middle">超声波模块</text>
    <text class="text-sub" x="320" y="665" text-anchor="middle">实时探测距离</text>

    <rect class="box" x="410" y="620" width="140" height="60" rx="8" />
    <text class="text-main" x="480" y="645" text-anchor="middle">语音模块</text>
    <text class="text-sub" x="480" y="665" text-anchor="middle">播报方位引导</text>

    <rect class="box" x="570" y="620" width="140" height="60" rx="8" />
    <text class="text-main" x="640" y="645" text-anchor="middle">蜂鸣器</text>
    <text class="text-sub" x="640" y="665" text-anchor="middle">偏离角度警报</text>

    <path class="line" d="M 320 680 L 320 730 L 400 730 L 400 760" marker-end="url(#arrow)" />
    <rect x="330" y="705" width="100" height="25" fill="#fff" />
    <text class="text-sub" x="380" y="722" text-anchor="middle" font-weight="bold">探测达到</text>

    <rect class="box-highlight" x="250" y="770" width="300" height="50" />
    <text class="text-main" x="400" y="800" text-anchor="middle">语音终端提示：已到达目标附近</text>

</svg>
